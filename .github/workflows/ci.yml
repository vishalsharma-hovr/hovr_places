name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (analyze, test, contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: dart run tool/check_channel_contract.dart

  android:
    name: Android (Kotlin unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Gradle wrapper (git-ignored in example/android)
        working-directory: example
        run: flutter build apk --config-only
      - working-directory: example/android
        run: ./gradlew :hovr_places:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kotlin-test-reports
          path: example/build/hovr_places/reports/tests

  ios:
    name: iOS (Swift tests, example build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Swift parser tests
        working-directory: ios
        run: swift test
      - name: Build example for simulator
        working-directory: example
        run: flutter build ios --simulator --debug
